[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woocommerce-scraper"
version = "0.1.0"
description = "Python SDK for the WooCommerce Scraper Apify actor — full catalog extraction with variants, reviews, brand auto-detection, FX conversion, Shopify CSV export and Google Merchant feed for any WooCommerce store."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
keywords = [
    "woocommerce", "woocommerce-scraper", "woocommerce-api",
    "woocommerce-store-api", "wp-json", "wordpress-scraper",
    "ecommerce-scraper", "product-scraper", "catalog-scraper",
    "woocommerce-to-shopify", "shopify-migration", "shopify-csv-export",
    "google-merchant-feed", "google-shopping",
    "competitor-intelligence", "price-monitoring",
    "web-scraping", "apify", "apify-actor", "python-sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/apivault-labs/woocommerce-scraper-python"
Documentation = "https://github.com/apivault-labs/woocommerce-scraper-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/woocommerce-product-scraper"
"Bug Tracker" = "https://github.com/apivault-labs/woocommerce-scraper-python/issues"

[tool.setuptools.packages.find]
include = ["woocommerce_scraper*"]
